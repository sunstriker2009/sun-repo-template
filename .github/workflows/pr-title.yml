name: PR title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  pull-requests: read
jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate Conventional Commit PR title
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|chore|refactor|test|ci|build|perf|revert)(\([a-zA-Z0-9._/-]+\))?!?:[[:space:]].+ ]]; then
            echo "::error::PR title must follow Conventional Commits, e.g. feat(api): add endpoint"
            exit 1
          fi
